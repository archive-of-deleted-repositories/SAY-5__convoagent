[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convoagent"
version = "0.1.0"
description = "Conversational AI customer support agent — Python NLP backend with intent + sentiment + escalation policy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SAY-5" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
convoagent = "convoagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["convoagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
